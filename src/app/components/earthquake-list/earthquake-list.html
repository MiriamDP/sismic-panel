<table class="table">
  <thead>
    <tr>
      <th>Magnitud</th>
      <th>Lugar</th>
      <th>Fecha</th>
      <th>Latitud</th>
      <th>Longitud</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (earthquake of earthquakes();track earthquake.id) {
    <tr [routerLink]="['/historic',earthquake.id]" [state]="{
    page: currentPage(),
    pageSize: pageSize()
  }" class="cursor-pointer  hover:bg-base-200">
      <td>{{ earthquake.magnitude }}</td>
      <td>{{ earthquake.place }}</td>
      <td>{{ earthquake.event_time | date:'short' }}</td>
      <td>{{ earthquake.latitude }}</td>
      <td>{{ earthquake.longitude }}</td>
      @if (isToday(earthquake.event_time)) {
        <td>
          <div class="badge badge-accent">Nuevo</div>
        </td>
      } @else {
        <td></td>
      }
    </tr>
    }

  </tbody>
</table>


<div class="card bg-base-100 shadow-md">

  <div class="card-body">

    <h2 class="card-title text-lg">
      <i class="fa-solid fa-chart-line text-success"></i>
      Evolución comparativa de terremotos
    </h2>

    <p class="text-sm opacity-60">
      Evolución de la actividad sísmica entre
      {{ firstYear() }} y {{ secondYear() }}.
    </p>

    <app-base-chart
      [config]="chartConfig()">
    </app-base-chart>

  </div>

</div>

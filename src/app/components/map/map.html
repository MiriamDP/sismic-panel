<div class="flex gap-4 mt-4 mb-4">

    <div
        class="map flex-1"
        leaflet
        [leafletOptions]="options"
        (leafletMapReady)="onMapReady($event)"
        aria-label="Mapa interactivo de terremotos">
    </div>
    
    <footer class="flex flex-col w-2xs"><strong>Profundidad</strong><span>🟡 Menos de 70 km</span><span>🟠 70–299,99 km</span><span>🟣 300 km o
        más</span><span>⚪ No disponible</span>
    <p>Tamaño: escala visual creciente con la magnitud; no representa energía ni área afectada. Sin magnitud: radio
        mínimo. El mapa base puede desactivarse en el selector de capas.</p>
    </footer>
</div>

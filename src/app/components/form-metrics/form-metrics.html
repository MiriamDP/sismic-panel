<form [formGroup]="analysisForm" (ngSubmit)="analyzeEarthquakes()" class="flex flex-col gap-4">
    <!-- País -->
    <label class="form-control w-full">
        <span class="label-text">País</span>
        <select class="select select-bordered w-full" formControlName="countryCode">
            <option value="">Todos los países</option>
            @if (countries.isLoading()) {
            <p class="text-sm text-gray-500">
                Cargando países...
            </p>
            }

            @if (countries.error()) {
            <p class="text-sm text-error">
                No se pudieron cargar los países.
            </p>
            }
            @if (countries.hasValue()) {
            @for (country of countries.value(); track country.adm0_a3) {
            <option [value]="country.adm0_a3">
                {{ country.name_es }}
            </option>
            }
            }
        </select>
    </label>

    <!-- Magnitud -->

    <div>
        <h3>Magnitud</h3>
        <label class="form-control">
            <span class="label-text">Mínima</span>
            <input type="number" step="0.1" class="input input-bordered" formControlName="minMagnitude">
        </label>
        <label class="form-control">
            <span class="label-text">Máxima</span>
            <input type="number" step="0.1" class="input input-bordered" formControlName="maxMagnitude">
        </label>
    </div>

    <!-- Fechas -->

    <div>
        <h3>Periodo de análisis</h3>
        <label class="form-control">
            <span class="label-text">Desde</span>
            <input type="date" class="input input-bordered" formControlName="startDate">
        </label>
        <label class="form-control">
            <span class="label-text">Hasta</span>
            <input type="date" class="input input-bordered" formControlName="endDate">
        </label>
    </div>

    <!-- Profundidad -->

    <div>
        <h3>Profundidad (km)</h3>
        <label class="form-control">
            <span class="label-text">Mínima</span>
            <input type="number" class="input input-bordered" formControlName="minDepth">
        </label>
        <label class="form-control">
            <span class="label-text">Máxima</span>
            <input type="number" class="input input-bordered" formControlName="maxDepth">
        </label>
    </div>

    <button type="button" class="btn btn-outline" (click)="clearAnalysisFilters()"> Limpiar filtros </button>

    <button type="submit" class="btn btn-primary" (click)="analyzeEarthquakes()"> Analizar terremotos </button>

</form>
